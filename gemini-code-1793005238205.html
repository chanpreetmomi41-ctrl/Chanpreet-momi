<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ਲੋੜਵੰਦਾਂ ਦੀ ਮਦਦ - Donate</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .donate-btn {
            background-color: #27ae60;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
        }
        .donate-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ਲੋੜਵੰਦਾਂ ਦੀ ਸਹਾਇਤਾ ਲਈ ਯੋਗਦਾਨ ਪਾਓ</h1>
        <p>ਤੁਹਾਡਾ ਛੋਟਾ ਜਿਹਾ ਯੋਗਦਾਨ ਕਿਸੇ ਲੋੜਵੰਦ ਦੀ ਜ਼ਿੰਦਗੀ ਵਿੱਚ ਵੱਡਾ ਬਦਲਾਅ ਲਿਆ ਸਕਦਾ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਦਾਨ ਕਰਨ ਲਈ ਹੇਠਾਂ ਦਿੱਤੇ ਬਟਨ 'ਤੇ ਕਲิก ਕਰੋ ਜੀ।</p>
        
        <!-- ਇੱਥੇ # ਦੀ ਜਗਾ ਆਪਣਾ Payment Link ਜਾਂ UPI ID ਪਾਓ -->
        <a href="#" class="donate-btn">Donate Now (ਦਾਨ ਕਰੋ)</a>
    </div>

</body>
</html>
